version: '3.8'

services:
  rag-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3003:3003"
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./package.json:/app/package.json
    environment:
      - NODE_ENV=development
      - PORT=3003
      - LOG_LEVEL=debug
      - USE_MOCK_DATA=false
    depends_on:
      - mongodb
      - chroma

  mongodb:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=email-rag

  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  mongodb_data:
  chroma_data: 